name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy --strict app/

      - name: Tests (offline, no secrets)
        run: uv run pytest -v --cov=app --cov-report=term-missing

      - name: EDD quality gate (offline scorecard)
        run: uv run python -m evaluation.run_eval

      - name: Dependency audit
        run: uvx pip-audit -r requirements.txt

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --verbose
